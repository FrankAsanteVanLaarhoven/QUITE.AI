name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiet
          POSTGRES_PASSWORD: quiet
          POSTGRES_DB: quiet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiet -d quiet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/core.test.ts
      - run: pnpm exec vitest run tests/integration.test.ts
        env:
          QUIET_TEST_DATABASE_URL: postgres://quiet:quiet@127.0.0.1:5432/quiet_test
          QUIET_SESSION_SECRET: ci-session-secret-at-least-32-characters
      - run: pnpm build
      - run: pnpm lint
